<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>블랙잭</title>
<style>
  :root {
    --bg: #1a1d24;
    --panel: #242832;
    --text: #e8e6e0;
    --muted: #9a9788;
    --accent: #d4a24e;
    --win: #7fd48a;
    --lose: #e05555;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Apple SD Gothic Neo", "Pretendard", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 24px 16px;
    -webkit-user-select: none;
    user-select: none;
  }
  button { touch-action: manipulation; }
  h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; text-align: center; }
  .bar {
    display: flex;
    gap: 20px;
    margin-top: 12px;
    background: var(--panel);
    padding: 8px 20px;
    border-radius: 8px;
    font-size: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .bar b { color: var(--accent); font-variant-numeric: tabular-nums; }
  #notice {
    min-height: 20px;
    font-size: 13px;
    color: var(--accent);
    margin: 6px 0 2px;
    text-align: center;
    max-width: 640px;
  }
  button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid #3a3f4d;
    border-radius: 8px;
    padding: 9px 18px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    transition: background .15s;
  }
  button:hover { background: #2f3442; }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); color: #1a1d24; border-color: var(--accent); font-weight: 700; }
  button.primary:hover:not(:disabled) { background: #e0b160; }

  /* ---- 테이블 (녹색 펠트) ---- */
  #table { width: min(720px, 96vw); margin-top: 10px; }
  #felt {
    width: 100%;
    border-radius: 18px 18px 45% 45% / 18px 18px 22% 22%;
    background: radial-gradient(ellipse at 50% 28%, #2f6d49, #1c4a30 78%);
    border: 9px solid #3b2f21;
    box-shadow: 0 10px 34px rgba(0,0,0,.5), inset 0 0 60px rgba(0,0,0,.35);
    padding: 20px 18px 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    min-height: 360px;
  }
  .zone { display: flex; flex-direction: column; align-items: center; gap: 7px; }
  .zlabel {
    font-size: 13px;
    font-weight: 700;
    color: #cfe6d4;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .vbadge {
    font-size: 13px;
    font-weight: 700;
    color: #f4e3b8;
    background: rgba(0,0,0,.35);
    padding: 2px 10px;
    border-radius: 10px;
    min-height: 20px;
    min-width: 34px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .cards { display: flex; gap: 6px; min-height: 66px; align-items: flex-end; }
  #midMsg {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 700;
    color: #f4e3b8;
    text-align: center;
    min-height: 34px;
    text-shadow: 0 1px 4px rgba(0,0,0,.6);
  }
  #midMsg .net-win { color: var(--win); }
  #midMsg .net-lose { color: #ff9a9a; }
  #playerHands { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .hand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    padding: 8px 12px 6px;
    border-radius: 12px;
    border: 1px solid transparent;
  }
  .hand.active {
    border-color: var(--accent);
    background: rgba(0,0,0,.2);
    box-shadow: 0 0 0 1px var(--accent);
  }
  .hbet { font-size: 12px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .hres { font-size: 13px; font-weight: 800; min-height: 18px; }
  .hres.r-win { color: var(--win); }
  .hres.r-lose { color: #ff9a9a; }
  .hres.r-push { color: var(--text); }

  /* ---- 카드 ---- */
  .pcard {
    width: 46px; height: 64px;
    background: #fdfdf8;
    border-radius: 5px;
    color: #16181d;
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1.05;
    font-weight: 800;
    box-shadow: 0 2px 5px rgba(0,0,0,.45);
    flex-shrink: 0;
  }
  .pcard .rk { font-size: 18px; }
  .pcard .st { font-size: 16px; }
  .pcard.red { color: #c62828; }
  .pcard.back {
    background: repeating-linear-gradient(135deg, #5a3d8a 0 4px, #4a3172 4px 8px);
    border: 2px solid #efe9dc;
  }
  @keyframes dealIn {
    from { transform: translateY(-20px) scale(.88); opacity: 0; }
    to { transform: none; opacity: 1; }
  }
  .pcard.deal { animation: dealIn .3s ease-out both; }

  /* ---- 컨트롤 ---- */
  .cbox {
    margin-top: 10px;
    background: var(--panel);
    border: 1px solid #3a3f4d;
    border-radius: 10px;
    padding: 12px 14px;
    display: none;
    flex-direction: column;
    gap: 10px;
    align-items: center;
    width: min(560px, 96vw);
  }
  .cbox.on { display: flex; }
  .arow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; width: 100%; }
  button.chip {
    border-radius: 50%;
    width: 62px; height: 62px;
    padding: 0;
    border: 3px dashed rgba(255,255,255,.55);
    font-weight: 800;
    font-size: 13px;
    color: #fff;
    box-shadow: 0 3px 8px rgba(0,0,0,.4);
  }
  button.chip:hover:not(:disabled) { filter: brightness(1.15); }
  .chip[data-v="100"] { background: #3b6ea5; }
  .chip[data-v="500"] { background: #7a3b8f; }
  .chip[data-v="1000"] { background: #b03a3a; }
  #betShow { font-size: 15px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; min-width: 120px; text-align: center; }
  #dealBtn { min-width: 140px; }
  #hitBtn, #standBtn, #dblBtn, #splitBtn { min-width: 96px; }

  .controls { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; justify-content: center; align-items: center; }
  #nextBtn { min-width: 150px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 12px; max-width: 620px; text-align: center; line-height: 1.6; }
  a.home { color: var(--muted); font-size: 12px; margin-top: 16px; text-decoration: none; }
  a.home:hover { color: var(--accent); }

  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(15,17,22,.97);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    text-align: center;
    padding: 24px;
  }
  #overlay.show { display: flex; }
  #overlay h2 { font-size: 22px; margin-bottom: 12px; }
  #overlay p { color: var(--muted); font-size: 15px; line-height: 1.9; max-width: 440px; white-space: pre-line; }
  #overlayBtns { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; min-width: 280px; }

  /* ---- 모바일 ---- */
  @media (max-width: 600px) {
    html, body { overflow-x: hidden; }
    body { padding: 14px 8px 20px; }
    h1 { font-size: 18px; }
    .sub { font-size: 11px; }
    .bar { font-size: 12px; gap: 10px; padding: 6px 12px; margin-top: 10px; }
    #notice { font-size: 12px; }

    #table { width: calc(100vw - 16px); }
    #felt { border-width: 6px; padding: 14px 8px 26px; min-height: 300px; gap: 8px; }
    .zlabel { font-size: 12px; }
    .vbadge { font-size: 12px; padding: 2px 8px; }
    .cards { gap: 4px; min-height: 56px; }
    #midMsg { font-size: 13px; min-height: 28px; }
    #playerHands { gap: 8px; }
    .hand { padding: 6px 6px 4px; }
    .hbet { font-size: 11px; }
    .hres { font-size: 12px; }

    .pcard { width: 38px; height: 54px; border-radius: 4px; }
    .pcard .rk { font-size: 15px; }
    .pcard .st { font-size: 13px; }

    /* 터치 타깃 44px 이상 */
    button { min-height: 44px; }
    .cbox { width: 100%; padding: 10px 8px; }
    .arow { gap: 6px; }
    button.chip { width: 56px; height: 56px; font-size: 12px; }
    #allinBtn, #clearBtn { flex: 1 1 0; min-width: 0; padding: 8px 4px; font-size: 13px; white-space: nowrap; }
    #betShow { min-width: 0; flex: 1 1 0; font-size: 14px; }
    #dealBtn { flex: 1.2 1 0; min-width: 0; min-height: 48px; }
    #hitBtn, #standBtn, #dblBtn, #splitBtn {
      flex: 1 1 0; min-width: 0; min-height: 48px;
      padding: 8px 4px; font-size: 14px; white-space: nowrap;
    }
    #nextBtn { min-height: 48px; }
    .hint { font-size: 11px; }
    #overlay h2 { font-size: 20px; }
    #overlay p { font-size: 14px; }
    #overlayBtns { min-width: 0; width: 100%; max-width: 300px; }
  }
</style>
</head>
<body>
  <h1>블랙잭 <span>Blackjack</span></h1>
  <div class="sub">6덱 슈 · 딜러 소프트 17 스탠드(S17) · 블랙잭 3:2 · 시작 잔액 10,000 (플레이 머니)</div>

  <div class="bar" id="infoBar"></div>
  <div id="notice"></div>

  <div id="table">
    <div id="felt">
      <div class="zone">
        <div class="zlabel">딜러 <span class="vbadge" id="dealerVal"></span></div>
        <div class="cards" id="dealerCards"></div>
      </div>
      <div id="midMsg"></div>
      <div class="zone">
        <div id="playerHands"></div>
        <div class="zlabel">내 핸드</div>
      </div>
    </div>
  </div>

  <div id="betBox" class="cbox">
    <div class="arow">
      <button class="chip" data-v="100">100</button>
      <button class="chip" data-v="500">500</button>
      <button class="chip" data-v="1000">1000</button>
      <button id="allinBtn">올인</button>
      <button id="clearBtn">초기화</button>
    </div>
    <div class="arow">
      <span id="betShow"></span>
      <button id="dealBtn" class="primary">딜</button>
    </div>
  </div>

  <div id="actBox" class="cbox">
    <div class="arow">
      <button id="hitBtn" class="primary">히트</button>
      <button id="standBtn">스탠드</button>
      <button id="dblBtn">더블</button>
      <button id="splitBtn">스플릿</button>
    </div>
  </div>

  <div class="controls">
    <button id="nextBtn" class="primary" style="display:none">다음 판</button>
    <button id="newBtn">새 게임</button>
  </div>

  <div class="hint">
    표준 룰 vs 딜러 — 6덱 슈(약 75% 소진 시 리셔플) · 딜러는 소프트 17 포함 모든 17에서 스탠드 ·
    블랙잭 3:2 · 더블은 첫 2장에서만(베팅 2배 후 1장) · 스플릿은 같은 랭크 1회(각 핸드 독립, A 스플릿은 각 1장만,
    스플릿 후 21은 블랙잭이 아님) · 서렌더·보험은 미구현(단순화).
  </div>
  <a class="home" href="../index.html">← 게임 선택으로</a>

  <div id="overlay">
    <h2 id="overlayTitle"></h2>
    <p id="overlayDesc"></p>
    <div id="overlayBtns"></div>
  </div>

<script>
// ==================== 블랙잭 코어 (순수 로직 — DOM 무의존, 테스트 공유) ====================
/* __BJ_CORE_START__ */
function bjCore() {
  'use strict';

  // 카드 = 0..51 (6덱 슈에 반복 수록). rank = c % 13: 0=A, 1=2 … 8=9, 9=T, 10=J, 11=Q, 12=K. suit = (c/13)|0
  var NUM_DECKS = 6;
  var SHOE_SIZE = 52 * NUM_DECKS;
  var PENETRATION = 0.75;          // 슈의 75% 소진 시 다음 판 시작 전 리셔플
  var RANK_CH = 'A23456789TJQK';
  var SUIT_SYM = ['♠', '♥', '♦', '♣'];

  function rankOf(c) { return c % 13; }
  function suitOf(c) { return (c / 13) | 0; }
  function cardPoint(c) {           // 단독 카드 점수 (A=11)
    var r = c % 13;
    return r === 0 ? 11 : (r >= 9 ? 10 : r + 1);
  }

  // 핸드 값: A는 11로 세되 버스트면 하나씩 1로 강등 (다중 소프트 에이스 처리)
  function handValue(cards) {
    var total = 0, aces = 0, i, r;
    for (i = 0; i < cards.length; i++) {
      r = cards[i] % 13;
      if (r === 0) { aces++; total += 11; }
      else total += (r >= 9 ? 10 : r + 1);
    }
    while (total > 21 && aces > 0) { total -= 10; aces--; }
    return { total: total, soft: aces > 0 };
  }

  // 블랙잭 = 최초 2장으로 21 (스플릿 핸드의 21은 블랙잭이 아님 — startRound에서만 판정)
  function isBlackjack(cards) {
    return cards.length === 2 && handValue(cards).total === 21;
  }

  function newShoe(rng) {
    var d = [], i, j, t;
    for (i = 0; i < SHOE_SIZE; i++) d.push(i % 52);
    for (i = SHOE_SIZE - 1; i > 0; i--) {
      j = (rng() * (i + 1)) | 0;
      t = d[i]; d[i] = d[j]; d[j] = t;
    }
    return d;
  }

  function createState(rng, startBalance) {
    return {
      balance: startBalance || 10000,
      shoe: newShoe(rng), pos: 0, reshuffled: false,
      phase: 'bet',                 // 'bet' | 'player' | 'done'
      hands: [], active: -1,
      dealer: [], holeHidden: true,
      bet: 0,
    };
  }

  function needShuffle(st) { return st.pos >= st.shoe.length * PENETRATION; }

  function draw(st, rng) {
    if (st.pos >= st.shoe.length) {   // 안전장치 — 75% 페네트레이션에선 실제 도달 불가
      st.shoe = newShoe(rng || Math.random);
      st.pos = 0;
    }
    return st.shoe[st.pos++];
  }

  // 베팅 후 딜: 플레이어 2장 오픈 + 딜러 1오픈 1히든. 블랙잭은 즉시 판정(딜러 픽).
  function startRound(st, bet, rng) {
    if (st.phase !== 'bet') return { error: 'phase' };
    bet = Math.floor(bet);
    if (!(bet > 0) || bet > st.balance) return { error: 'bet' };
    if (needShuffle(st)) { st.shoe = newShoe(rng); st.pos = 0; st.reshuffled = true; }
    else st.reshuffled = false;
    st.bet = bet;
    st.balance -= bet;
    var p = [draw(st, rng)];
    var d = [draw(st, rng)];
    p.push(draw(st, rng));
    d.push(draw(st, rng));
    st.hands = [{ cards: p, bet: bet, done: false, busted: false, doubled: false, split: false, result: null }];
    st.dealer = d;
    st.holeHidden = true;
    st.active = 0;
    var pBJ = isBlackjack(p), dBJ = isBlackjack(d);
    if (pBJ || dBJ) {
      st.holeHidden = false;
      st.hands[0].done = true;
      if (pBJ && dBJ) { st.hands[0].result = 'push'; st.balance += bet; }               // 푸시: 베팅 반환
      else if (dBJ) { st.hands[0].result = 'lose'; }                                    // 딜러 블랙잭
      else { st.hands[0].result = 'blackjack'; st.balance += bet + Math.floor(bet * 1.5); }  // 3:2
      st.phase = 'done';
      return { immediate: true, playerBJ: pBJ, dealerBJ: dBJ };
    }
    st.phase = 'player';
    return { immediate: false };
  }

  function legalMoves(st) {
    if (st.phase !== 'player') return { hit: false, stand: false, double: false, split: false };
    var h = st.hands[st.active];
    var two = h.cards.length === 2;
    return {
      hit: true,
      stand: true,
      double: two && st.balance >= h.bet,                                     // 첫 2장 + 잔액 충분
      split: two && st.hands.length === 1 &&                                  // 1회만
             (h.cards[0] % 13) === (h.cards[1] % 13) && st.balance >= h.bet,  // 같은 랭크
    };
  }

  function advance(st, rng) {
    while (st.active < st.hands.length && st.hands[st.active].done) st.active++;
    if (st.active >= st.hands.length) dealerPlay(st, rng);
  }

  // move: 'hit' | 'stand' | 'double' | 'split'
  function act(st, move, rng) {
    if (st.phase !== 'player') return { error: 'phase' };
    var lm = legalMoves(st);
    if (!lm[move]) return { error: 'illegal' };
    var h = st.hands[st.active], v;
    if (move === 'hit') {
      h.cards.push(draw(st, rng));
      v = handValue(h.cards);
      if (v.total > 21) { h.busted = true; h.done = true; h.result = 'bust'; }
      else if (v.total === 21) h.done = true;      // 21은 자동 스탠드
    } else if (move === 'stand') {
      h.done = true;
    } else if (move === 'double') {                // 베팅 2배 + 정확히 1장 후 종료
      st.balance -= h.bet;
      h.bet *= 2;
      h.doubled = true;
      h.cards.push(draw(st, rng));
      h.done = true;
      if (handValue(h.cards).total > 21) { h.busted = true; h.result = 'bust'; }
    } else if (move === 'split') {                 // 같은 랭크 1회, 각 핸드 독립 진행
      st.balance -= h.bet;
      var isAces = (h.cards[0] % 13) === 0;
      var c2 = h.cards.pop();
      var h2 = { cards: [c2], bet: h.bet, done: false, busted: false, doubled: false, split: true, result: null };
      h.split = true;
      h.cards.push(draw(st, rng));
      h2.cards.push(draw(st, rng));
      st.hands.push(h2);
      if (isAces) { h.done = true; h2.done = true; }   // A 스플릿: 각 1장만 받고 종료
      else {
        if (handValue(h.cards).total === 21) h.done = true;
        if (handValue(h2.cards).total === 21) h2.done = true;
      }
    }
    advance(st, rng);
    return {};
  }

  // 딜러: 홀카드 공개 후 17 미만이면 히트, 소프트 17 포함 모든 17 이상 스탠드 (S17)
  function dealerPlay(st, rng) {
    st.holeHidden = false;
    var anyLive = false, i;
    for (i = 0; i < st.hands.length; i++) if (!st.hands[i].busted) anyLive = true;
    if (anyLive) {
      while (handValue(st.dealer).total < 17) st.dealer.push(draw(st, rng));
    }
    settle(st);
  }

  function settle(st) {
    var dv = handValue(st.dealer).total;
    var dBust = dv > 21;
    for (var i = 0; i < st.hands.length; i++) {
      var h = st.hands[i];
      if (h.busted) { h.result = 'bust'; continue; }              // 베팅 상실 (이미 차감됨)
      var pv = handValue(h.cards).total;
      if (dBust || pv > dv) { h.result = 'win'; st.balance += h.bet * 2; }
      else if (pv === dv) { h.result = 'push'; st.balance += h.bet; }
      else { h.result = 'lose'; }
    }
    st.phase = 'done';
  }

  // 정산 시 잔액에 더해진 총 반환액 (UI 연출·검증용)
  function settleReturn(st) {
    var g = 0;
    for (var i = 0; i < st.hands.length; i++) {
      var h = st.hands[i];
      if (h.result === 'win') g += h.bet * 2;
      else if (h.result === 'push') g += h.bet;
      else if (h.result === 'blackjack') g += h.bet + Math.floor(h.bet * 1.5);
    }
    return g;
  }

  function nextRound(st) {
    if (st.phase !== 'done') return false;
    st.hands = []; st.dealer = []; st.active = -1; st.bet = 0;
    st.holeHidden = true;
    st.phase = 'bet';
    return true;
  }

  return {
    NUM_DECKS: NUM_DECKS, SHOE_SIZE: SHOE_SIZE, PENETRATION: PENETRATION,
    RANK_CH: RANK_CH, SUIT_SYM: SUIT_SYM,
    rankOf: rankOf, suitOf: suitOf, cardPoint: cardPoint,
    handValue: handValue, isBlackjack: isBlackjack,
    newShoe: newShoe, createState: createState, needShuffle: needShuffle,
    startRound: startRound, legalMoves: legalMoves, act: act,
    settleReturn: settleReturn, nextRound: nextRound,
  };
}
/* __BJ_CORE_END__ */

// ==================== UI ====================
const core = bjCore();
const $id = id => document.getElementById(id);
const fmt = n => n.toLocaleString('ko-KR');

let st = core.createState(Math.random);
let pendingBet = 0, lastBet = 0, roundNo = 0;
let token = 0;                 // 새 게임/다음 판 시 진행 중 타이머 무효화
let anim = null;               // { p0, d, hole } — 단계적 공개 (null = 전부 표시)
let resultsShown = false;
let balanceOverride = null;    // 정산 연출 동안 잔액 표시 지연
let prev = { d: 0, hands: [], hole: false };   // 직전 렌더에서 보인 카드 수 (새 카드만 애니메이션)

function later(fn, ms) {
  const tk = token;
  setTimeout(() => { if (tk === token) fn(); }, ms);
}
function setNotice(msg) { $id('notice').textContent = msg || ''; }

const RES_TXT = { win: '승리', lose: '패배', push: '푸시', bust: '버스트', blackjack: '블랙잭!' };
const RES_CLS = { win: 'r-win', blackjack: 'r-win', lose: 'r-lose', bust: 'r-lose', push: 'r-push' };

function cardHTML(c, back, dealAnim) {
  if (back) return `<div class="pcard back${dealAnim ? ' deal' : ''}"></div>`;
  const rk = core.rankOf(c), su = core.suitOf(c);
  const rkTxt = core.RANK_CH[rk] === 'T' ? '10' : core.RANK_CH[rk];
  return `<div class="pcard${su === 1 || su === 2 ? ' red' : ''}${dealAnim ? ' deal' : ''}">` +
         `<span class="rk">${rkTxt}</span><span class="st">${core.SUIT_SYM[su]}</span></div>`;
}

function valText(cards) {
  if (!cards.length) return '';
  const v = core.handValue(cards);
  if (v.total > 21) return `버스트 ${v.total}`;
  return (v.soft ? '소프트 ' : '') + v.total;
}

function render() {
  const bal = balanceOverride != null ? balanceOverride : st.balance;
  const staked = st.hands.reduce((a, h) => a + h.bet, 0);
  const remaining = st.shoe.length - st.pos;
  $id('infoBar').innerHTML =
    `<span>잔액 <b>${fmt(bal)}</b></span>` +
    `<span>베팅 <b>${fmt(st.phase === 'bet' ? pendingBet : staked)}</b></span>` +
    `<span>슈 <b>${fmt(remaining)}</b>장</span>` +
    `<span>판 <b>#${roundNo}</b></span>`;

  // ---- 딜러 ----
  const dShow = anim && anim.d != null ? anim.d : st.dealer.length;
  const holeVisible = anim ? !!anim.hole : !st.holeHidden;
  let dh = '';
  for (let i = 0; i < dShow; i++) {
    const isNew = i >= prev.d || (i === 1 && holeVisible && !prev.hole);
    dh += cardHTML(st.dealer[i], i === 1 && !holeVisible, isNew);
  }
  $id('dealerCards').innerHTML = dh;
  prev.d = dShow; prev.hole = holeVisible;
  let dv = '';
  if (dShow >= 1) {
    if (!holeVisible) dv = core.cardPoint(st.dealer[0]) + (dShow >= 2 ? ' + ?' : '');
    else dv = valText(st.dealer.slice(0, dShow));
  }
  $id('dealerVal').textContent = dv;

  // ---- 플레이어 핸드 ----
  let ph = '';
  for (let i = 0; i < st.hands.length; i++) {
    const h = st.hands[i];
    const show = (anim && anim.p0 != null && i === 0) ? Math.min(anim.p0, h.cards.length) : h.cards.length;
    const pc = prev.hands[i] || 0;
    let ch = '';
    for (let k = 0; k < show; k++) ch += cardHTML(h.cards[k], false, k >= pc);
    prev.hands[i] = show;
    const active = st.phase === 'player' && !anim && i === st.active;
    const tags = [];
    if (h.doubled) tags.push('더블');
    if (h.split) tags.push('스플릿');
    const res = resultsShown && h.result
      ? `<div class="hres ${RES_CLS[h.result]}">${RES_TXT[h.result]}</div>`
      : '<div class="hres"></div>';
    ph += `<div class="hand${active ? ' active' : ''}">` +
          `<div class="cards">${ch}</div>` +
          `<div class="vbadge">${show ? valText(h.cards.slice(0, show)) : ''}</div>` +
          `<div class="hbet">베팅 ${fmt(h.bet)}${tags.length ? ' · ' + tags.join(' · ') : ''}</div>` +
          res + `</div>`;
  }
  if (!st.hands.length) ph = '<div class="hand"><div class="cards"></div><div class="vbadge"></div></div>';
  $id('playerHands').innerHTML = ph;
  prev.hands.length = st.hands.length;

  // ---- 중앙 메시지 ----
  let mid = '';
  if (st.phase === 'bet') mid = '칩을 눌러 베팅한 뒤 딜을 누르세요';
  else if (resultsShown) {
    const net = core.settleReturn(st) - staked;
    mid = net > 0 ? `<span class="net-win">+${fmt(net)} 획득!</span>`
        : net < 0 ? `<span class="net-lose">−${fmt(-net)}</span>`
        : '푸시 — 베팅 반환';
  }
  $id('midMsg').innerHTML = mid;

  // ---- 컨트롤 ----
  $id('betBox').classList.toggle('on', st.phase === 'bet');
  $id('actBox').classList.toggle('on', st.phase === 'player' && !anim);
  if (st.phase === 'bet') {
    $id('betShow').textContent = `베팅: ${fmt(pendingBet)}`;
    document.querySelectorAll('.chip').forEach(b => {
      b.disabled = pendingBet + parseInt(b.dataset.v, 10) > st.balance;
    });
    $id('allinBtn').disabled = st.balance <= 0 || pendingBet === st.balance;
    $id('clearBtn').disabled = pendingBet === 0;
    $id('dealBtn').disabled = pendingBet <= 0;
    $id('dealBtn').textContent = pendingBet > 0 ? `딜 (${fmt(pendingBet)})` : '딜';
  }
  if (st.phase === 'player' && !anim) {
    const lm = core.legalMoves(st);
    $id('hitBtn').disabled = !lm.hit;
    $id('standBtn').disabled = !lm.stand;
    $id('dblBtn').disabled = !lm.double;
    $id('splitBtn').disabled = !lm.split;
  }
  $id('nextBtn').style.display = st.phase === 'done' && resultsShown ? '' : 'none';
}

// ---- 딜 시작 (초기 딜링 연출) ----
function startDeal() {
  if (st.phase !== 'bet' || anim || pendingBet <= 0) return;
  const r = core.startRound(st, pendingBet, Math.random);
  if (r.error) { setNotice('베팅액을 확인하세요.'); return; }
  roundNo++;
  lastBet = pendingBet;
  setNotice(st.reshuffled ? '🔀 슈 리셔플 — 75% 소진' : '');
  resultsShown = false;
  balanceOverride = null;
  prev = { d: 0, hands: [], hole: false };
  token++;
  anim = { p0: 0, d: 0, hole: false };
  render();
  const steps = [() => { anim.p0 = 1; }, () => { anim.d = 1; }, () => { anim.p0 = 2; }, () => { anim.d = 2; }];
  let t = 140;
  for (const s of steps) { later(() => { s(); render(); }, t); t += 200; }
  later(() => {
    anim = null;
    if (st.phase === 'done') finishSequence();
    else render();
  }, t + 40);
}

// ---- 딜러 공개 + 정산 연출 ----
function finishSequence() {
  balanceOverride = st.balance - core.settleReturn(st);
  anim = { d: 2, hole: false };
  render();
  let t = 450;
  later(() => { anim.hole = true; render(); }, t);
  for (let k = 3; k <= st.dealer.length; k++) {
    t += 480;
    const kk = k;
    later(() => { anim.d = kk; render(); }, t);
  }
  t += 550;
  later(() => {
    anim = null;
    balanceOverride = null;
    resultsShown = true;
    render();
  }, t);
}

function onAct(mv) {
  if (st.phase !== 'player' || anim) return;
  if (!core.legalMoves(st)[mv]) return;
  const res = core.act(st, mv, Math.random);
  if (res.error) return;
  token++;
  if (st.phase === 'done') { render(); finishSequence(); }
  else render();
}

function onNext() {
  if (st.phase !== 'done' || !resultsShown) return;
  token++;
  core.nextRound(st);
  if (st.balance <= 0) { showGameOver(); return; }
  pendingBet = Math.min(lastBet, st.balance);
  resultsShown = false;
  balanceOverride = null;
  anim = null;
  prev = { d: 0, hands: [], hole: false };
  setNotice('');
  render();
}

function newSession() {
  token++;
  st = core.createState(Math.random);
  pendingBet = 0; lastBet = 0; roundNo = 0;
  anim = null; resultsShown = false; balanceOverride = null;
  prev = { d: 0, hands: [], hole: false };
  $id('overlay').classList.remove('show');
  setNotice('');
  render();
}

function showGameOver() {
  showOverlay('💸 게임 오버', `잔액이 0이 되었습니다.\n플레이한 판: ${roundNo}판\n\n새 게임으로 잔액 10,000을 다시 받으세요.`,
    [['새 게임', newSession]]);
}

function showOverlay(title, desc, buttons) {
  $id('overlayTitle').textContent = title;
  $id('overlayDesc').textContent = desc;
  const wrap = $id('overlayBtns');
  wrap.innerHTML = '';
  buttons.forEach(([label, cb], i) => {
    const b = document.createElement('button');
    b.textContent = label;
    if (i === 0) b.className = 'primary';
    b.addEventListener('click', cb);
    wrap.appendChild(b);
  });
  $id('overlay').classList.add('show');
}

// ---- 이벤트 바인딩 ----
document.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
  if (st.phase !== 'bet') return;
  const v = parseInt(b.dataset.v, 10);
  if (pendingBet + v <= st.balance) { pendingBet += v; render(); }
}));
$id('allinBtn').addEventListener('click', () => { if (st.phase === 'bet') { pendingBet = st.balance; render(); } });
$id('clearBtn').addEventListener('click', () => { if (st.phase === 'bet') { pendingBet = 0; render(); } });
$id('dealBtn').addEventListener('click', startDeal);
$id('hitBtn').addEventListener('click', () => onAct('hit'));
$id('standBtn').addEventListener('click', () => onAct('stand'));
$id('dblBtn').addEventListener('click', () => onAct('double'));
$id('splitBtn').addEventListener('click', () => onAct('split'));
$id('nextBtn').addEventListener('click', onNext);
$id('newBtn').addEventListener('click', newSession);

render();
</script>
</body>
</html>
